<!-- МОДАЛЬНОЕ ОКНО АУТЕНТИФИКАЦИИ -->
<div id="auth-modal" class="modal-overlay">
    <div class="modal-window">
        <!-- Кнопка закрытия окна (крестик) -->
        <button id="modal-close" class="modal-close-btn">✕</button>

        <h2>🔐 Добро пожаловать!</h2>

        <!-- Переключатели вкладок -->
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Вход</button>
            <button class="auth-tab" data-tab="register">Регистрация</button>
        </div>

        <!-- ФОРМА ВХОДА -->
        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label for="login-password">Пароль:</label>
                <input type="password" id="login-password" required placeholder="Введите пароль">
            </div>
            <button type="submit" class="auth-btn">Войти</button>
        </form>

        <!-- ФОРМА РЕГИСТРАЦИИ -->
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="register-name">Имя:</label>
                <input type="text" id="register-name" required placeholder="Ваше имя">
            </div>
            <div class="form-group">
                <label for="register-email">Email:</label>
                <input type="email" id="register-email" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label for="register-password">Пароль (мин. 6 символов):</label>
                <input type="password" id="register-password" required placeholder="Придумайте пароль">
            </div>
            <button type="submit" class="auth-btn">Зарегистрироваться</button>
        </form>
    </div>
</div>
